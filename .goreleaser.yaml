# GoReleaser configuration for tailcat releases.
# See RELEASING.md for how to cut a release.
version: 2

builds:
  - id: tailcat
    main: ./cmd/tailcat
    binary: tailcat
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    # Keep the tag list in sync with build-tags.txt and
    # internal/buildtags.ReleaseTags, which a test enforces.
    # Regenerate with: go run ./internal/buildtags/printtags
    flags:
      - -tags=netgo,omitidna,omitpemdecrypt,osusergo,ts_omit_ace,ts_omit_acme,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_cachenetmap,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientmetrics,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_dns,ts_omit_doctor,ts_omit_drive,ts_omit_favorites,ts_omit_flashappliance,ts_omit_health,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_ipnbus,ts_omit_iptables,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_outboundproxy,ts_omit_peerapiclient,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_portmapper,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serve,ts_omit_serviceclientprefs,ts_omit_synology,ts_omit_syslog,ts_omit_syspolicy,ts_omit_systray,ts_omit_taildrop,ts_omit_tailnetlock,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_useproxy,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      tailcat_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

nfpms:
  - package_name: tailcat
    homepage: https://github.com/Audi-dask/tailcat
    maintainer: Audi-dask
    description: Netcat-like tool over Tailscale's data plane, without Tailscale's control plane, with local TCP forwarding support.
    license: BSD-3-Clause
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  header: |
    ## 版本说明

    这是 Audi-dask/tailcat 仓库发布的首个自维护版本。

    本版本基于官方 Tailcat v0.4.0，并增加了官方当前尚未提供的本地 TCP 转发能力。

    本项目是独立维护和发布的 Tailcat 发行版本，不代表 Tailscale 官方版本。

    ## 新增功能

    ### 本地 TCP 端口转发

    将 Tailcat 服务端提供的端口映射为本地 TCP 监听端口：

    ```bash
    tailcat serve 8080
    tailcat forward <addrblob> 18080:8080
    ```

    ### 转发到远程局域网资产

    服务端以 exit-node 模式启动：

    ```bash
    tailcat serve exit-node
    ```

    客户端将本地端口转发到服务端网络中的远程资产：

    ```bash
    tailcat forward <addrblob> 13306:192.168.1.10:3306
    ```

    访问 `127.0.0.1:13306` 即可转发到 `192.168.1.10:3306`。

    支持的映射格式：

    ```text
    <远程端口>
    <本地端口>:<远程端口>
    <本地端口>:<远程主机>:<远程端口>
    ```

    默认监听地址为 `127.0.0.1`，可使用 `--bind` 指定其他本地监听地址。

    ## 发布产物

    本版本提供 Linux、Windows 二进制，以及 Debian、RPM 软件包和 checksums.txt 校验文件。

    本项目不构建和发布 Docker 镜像。

    ## 分支说明

    - `main`：跟随官方上游，不放入长期定制功能；
    - `cmd-forward`：原始本地端口转发功能分支，用于向官方提交 PR；
    - `forward-exit-node`：远程目标转发功能分支，用于向官方提交 PR；
    - `stable`：本项目自己的稳定发布分支，包含官方未合并的功能和后续新增功能。

    ## 校验文件

    下载发布产物后，请使用同版本的 `checksums.txt` 进行完整性校验。

  disable: false
